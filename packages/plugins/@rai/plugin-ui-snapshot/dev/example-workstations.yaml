# Example YAML Configuration for UI Snapshot Plugin
# This file demonstrates the YAML format for defining NocoBase UI pages.
#
# Usage:
#   curl -X POST http://localhost:13000/api/ui-snapshot:create \
#     -H "Authorization: Bearer $TOKEN" \
#     -H "X-Role: root" \
#     -H "Content-Type: application/json" \
#     -d '{"yaml": "...", "force": false}'

page:
  title: "Workstations"
  icon: "DesktopOutlined"
  route: "EngOps/Workstations"  # Optional - auto-generated if omitted

# Collection aliases - maps logical names to actual internal names
# When collection is recreated, just update this mapping
collections:
  WorkStation: t_9dx8b5vb55b

# Grid layout (24-column system)
# - Total column widths per row should not exceed 24
# - Blocks are referenced using $ref: "#/blocks/<block_name>"
layout:
  rows:
    - columns:
        - width: 15  # out of 24 (62.5%)
          blocks:
            - $ref: "#/blocks/workstation_table"
        - width: 9   # out of 24 (37.5%)
          blocks:
            - $ref: "#/blocks/os_pie_chart"
            - $ref: "#/blocks/location_bar_chart"

# Block definitions
blocks:
  workstation_table:
    type: TableBlockModel
    collection: WorkStation  # Uses alias, resolved at creation time
    columns:
      - field: name
        sortable: true
      - field: os
        sortable: true
      - field: ip_address
      - field: location
      - field: gpu_specs
      - field: site
    actions:
      - type: filter
      - type: view
      - type: edit
    pageSize: 20

  os_pie_chart:
    type: ChartBlockModel
    collection: WorkStation
    chart:
      type: pie
      dimension: os
      measure:
        field: id
        aggregation: count
      options:
        legend: true
        tooltip: true
        labelType: percent

  location_bar_chart:
    type: ChartBlockModel
    collection: WorkStation
    chart:
      type: bar
      dimension: location
      measure:
        field: id
        aggregation: count
      options:
        legend: true
        tooltip: true
